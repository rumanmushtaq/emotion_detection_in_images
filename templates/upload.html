<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection - Upload</title>
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container text-center mt-3">
        <a href="{{ url_for('index') }}" class="btn btn-outline-primary btn-lg">
            <i class="fas fa-home"></i> Home
        </a>
    </div>

    <div class="container py-5">
        <h1 class="text-center text-primary fw-bold mb-4">Emotion Detection - Upload Image</h1>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                    {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}

                <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data" class="p-4 border rounded bg-white shadow-lg" id="uploadForm">
                    <h3 class="text-center text-dark mb-4">Upload an Image to Analyze</h3>
                    <div class="mb-4">
                        <label for="image" class="form-label">Select an image file:</label>
                        <input type="file" name="image" id="image" class="form-control form-control-lg"
                               accept=".jpg,.jpeg,.png,.bmp,.webp" required>
                    </div>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-primary btn-lg px-4 py-2" id="submitBtn">
                            <i class="fas fa-upload"></i> Analyze Emotion
                        </button>
                    </div>
                    <div id="loadingSpinner" class="text-center mt-3" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Processing...</span>
                        </div>
                        <p class="text-muted mt-2">Analyzing image...</p>
                    </div>
                </form>

                {% if emotion %}
                <div class="mt-5 text-center">
                    <h2 class="text-success mb-3">Detected Emotion: <strong>{{ emotion }}</strong></h2>
                </div>
                <div class="mt-3">
                    <img src="data:image/jpeg;base64,{{ image }}" alt="Processed image with detected emotion" class="rounded shadow-lg img-fluid fade-in" />
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', function() {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loadingSpinner').style.display = 'block';
        });
    </script>
</body>
</html>

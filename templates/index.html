<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection App</title>
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container text-center py-5">
        <h1 class="display-4 fw-bold text-primary">Emotion Detection App</h1>
        <p class="lead text-secondary">Upload an image or use real-time detection to analyze emotions.</p>
        <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="{{ url_for('upload') }}" class="btn btn-primary btn-lg">
                <i class="fas fa-upload"></i> Upload Image
            </a>
            <a href="{{ url_for('real_time') }}" class="btn btn-success btn-lg">
                <i class="fas fa-video"></i> Real-Time Detection
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
